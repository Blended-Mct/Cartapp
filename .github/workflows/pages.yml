# Publishes the calculator to GitHub Pages.
#
# GitHub only lets the `github-pages` environment be deployed from the
# repository's DEFAULT branch. Anything else is rejected before the job even
# starts — a one-second failure with no logs, which is easy to misread as a
# broken build. So this runs on a push to either branch and the deploy step
# checks it is on the default branch, skipping quietly rather than failing
# when it is not. Whichever branch is the default is the one that publishes.
#
# The site is static: no build step, the files are uploaded as they are.
name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/business-cost-calculator-5p12p1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue rather than cancel. Pushing the same commit to both branches
# starts two runs at once, and cancelling would kill whichever one is actually
# allowed to publish — which is exactly what happened the first time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Check the pricing rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A broken price would be worse online than not deploying at all.
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    # Only the default branch may deploy to the github-pages environment.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages is already switched on; `enablement` is left off because the
      # workflow token is not allowed to create the site anyway.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
